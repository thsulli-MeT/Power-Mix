<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>sMV Power Mix — Level 2</title>
  <link rel="stylesheet" href="styles.css?v=1"/>
</head>
<body>
  <header class="sponsorbar">
    <a class="sponsor-box" href="https://smv-short-music-videos.printify.me/" target="_blank" rel="noopener" aria-label="SMV Merch Store">
      <img class="store-promo" src="../assets/smv-store-promo.svg" alt="SMV Store"/>
    </a>
    <div class="logo-wrap">
      <img src="../assets/power-mix-logo.png" alt="sMV Power Mix" class="logo-img" />
      <div class="l2-badge">LEVEL 2</div>
    </div>
    <a class="sponsor-box" href="https://shortmusicvideos.com" target="_blank" rel="noopener">
      <img class="smv-banner-logo" src="../assets/SMVBW.png" alt="SMV" />
    </a>
  </header>

  <section class="top-controls card">
    <button id="enableAudio" class="btn led">Enable Audio</button>
    <button id="playA" class="btn led">Deck A Play</button>
    <button id="playB" class="btn led">Deck B Play</button>
    <button id="runTransition" class="btn led">Auto Transition</button>

    <div class="record-controls">
      <button id="recordBtn" class="btn rec">● Record Mix</button>
      <button id="stopRecordBtn" class="btn" disabled>Stop</button>
      <button id="playRecordBtn" class="btn" disabled>Playback</button>
      <a id="downloadRecord" class="btn" download="powermix-level2.wav" aria-disabled="true">Download .wav</a>
      <span id="recordTimer">0:00 / 3:00</span>
    </div>
  </section>

  <section class="wavepanel card">
    <canvas id="waveA" class="wave-canvas" width="1200" height="90"></canvas>
    <canvas id="waveB" class="wave-canvas" width="1200" height="90"></canvas>
  </section>

  <main class="mixer-grid">
    <section class="deck card">
      <div class="deck-head">DECK A <span id="timeA">0:00 / 0:00</span></div>
      <div class="platter-wrap">
        <div class="platter-disc" id="platterA">
          <div class="platter-core"><img src="../assets/mt-logo.svg" class="platter-logo" alt="MT logo"></div>
        </div>
      </div>
      <div class="meta">Track: <span id="trackAName">—</span></div>
      <button id="loadLocalA" class="btn">Load A</button>
      <div class="channel-strip">
        <input id="volA" type="range" min="0" max="1" step="0.001" value="0.9" class="v-fader">
        <div class="meter" id="meterA"></div>
      </div>
    </section>

    <section class="center card">
      <div class="mixer-label">MASTER MIXER</div>
      <div class="master-meter" id="meterMaster"></div>
      <div class="cross-wrap">
        <input id="cross" type="range" min="0" max="1" step="0.001" value="0.5" class="v-cross">
      </div>
    </section>

    <section class="deck card">
      <div class="deck-head">DECK B <span id="timeB">0:00 / 0:00</span></div>
      <div class="platter-wrap">
        <div class="platter-disc" id="platterB">
          <div class="platter-core"><img src="../assets/mt-logo.svg" class="platter-logo" alt="MT logo"></div>
        </div>
      </div>
      <div class="meta">Track: <span id="trackBName">—</span></div>
      <button id="loadLocalB" class="btn">Load B</button>
      <div class="channel-strip">
        <input id="volB" type="range" min="0" max="1" step="0.001" value="0.9" class="v-fader">
        <div class="meter" id="meterB"></div>
      </div>
    </section>
  </main>

  <script src="app.js?v=1"></script>
</body>
</html>
